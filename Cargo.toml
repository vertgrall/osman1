[package]
name = "osman1"
version = "0.1.0"
edition = "2021"
description = "Osman by NT — colorful network traffic monitor built with Freya"
build = "build.rs"

[dependencies]
async-io = "2"
bytes = "1"
freya = { version = "0.4", features = ["plot", "engine", "tray"] }
keyboard-types = "0.8"
freya-skia-safe = { version = "0.98.1", default-features = false, features = ["textlayout"] }
sysinfo = "0.33"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"

[dev-dependencies]
freya-testing = "0.4"
